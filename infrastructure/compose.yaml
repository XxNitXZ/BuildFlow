services:
  postgres:
    image: postgres:17
    container_name: buildflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: buildflow
      POSTGRES_USER: buildflow
      POSTGRES_PASSWORD: buildflow_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: